name: qa

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Deterministic QA checks
        run: python -m qa.run
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: app/qa/report.md
